<!doctype html>
<html lang="he" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>מסך שלום</title>
    <style>
        :root{
            --bg1:#0f172a;
            --bg2:#0ea5a4;
            --card:#0b1220AA;
            --accent:#fff;
            --glass: rgba(255,255,255,0.06);
        }
        html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Hebrew",sans-serif;}
        body{
            background: linear-gradient(135deg,var(--bg1),var(--bg2));
            color:var(--accent);
            -webkit-font-smoothing:antialiased;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .splash{
            width:100%;
            max-width:900px;
            margin:24px;
            padding:48px;
            background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));
            border-radius:16px;
            box-shadow: 0 10px 30px rgba(2,6,23,0.6);
            backdrop-filter: blur(6px);
            text-align:center;
            transition: transform .6s ease, opacity .6s ease;
        }

        .logo{
            font-size:64px;
            font-weight:700;
            margin:0 0 8px;
            letter-spacing:1px;
        }
        .subtitle{
            font-size:20px;
            margin:0 0 24px;
            opacity:0.92;
        }

        .actions{
            display:flex;
            gap:12px;
            justify-content:center;
            flex-wrap:wrap;
            margin-top:12px;
        }

        .btn{
            background:transparent;
            border:2px solid rgba(255,255,255,0.18);
            color:var(--accent);
            padding:10px 18px;
            border-radius:10px;
            font-weight:600;
            cursor:pointer;
            transition: transform .12s ease, background .12s ease, box-shadow .12s ease;
        }
        .btn:active{transform:translateY(1px) scale(0.998)}
        .btn.primary{
            background:rgba(255,255,255,0.12);
            box-shadow: 0 6px 18px rgba(14,165,164,0.16);
            border-color: rgba(255,255,255,0.18);
        }

        .splash.hidden{
            opacity:0;
            transform: translateY(-20px) scale(0.98);
            pointer-events:none;
        }

        /* hidden main content */
        #app{display:none;padding:40px;max-width:900px;margin:20px;border-radius:12px;background:var(--glass);color:var(--accent);}
        #app.visible{display:block;}

        @media (max-width:520px){
            .logo{font-size:44px}
            .subtitle{font-size:16px}
            .splash{padding:28px}
        }
    </style>
</head>
<body>
    <div class="splash" id="splash" role="dialog" aria-labelledby="welcomeTitle" aria-describedby="welcomeDesc">
        <h1 id="welcomeTitle" class="logo">שלום</h1>
        <p id="welcomeDesc" class="subtitle">ברוכים הבאים. לחצו להתחלה או המתינו few שניות כדי לעבור.</p>
        <div class="actions">
            <button class="btn primary" id="startBtn">התחל</button>
            <button class="btn" id="skipBtn">דלג</button>
        </div>
    </div>

    <main id="app" aria-live="polite">
        <h2>תוכן האתר-ברוכים הבאים</h2>
        <p>זהו האזור הראשי של הדף. המסך הראשוני נסגר וניתן להמשיך.</p>
    </main>

    <script>
        (function(){
            const splash = document.getElementById('splash');
            const app = document.getElementById('app');
            const start = document.getElementById('startBtn');
            const skip = document.getElementById('skipBtn');

            function showApp(){
                splash.classList.add('hidden');
                // wait for transition then reveal main content
                setTimeout(()=> app.classList.add('visible'), 550);
            }

            start.addEventListener('click', showApp);
            skip.addEventListener('click', showApp);

            // auto-hide after 5 seconds
            setTimeout(showApp, 5000);
        })();
    </script>
</body>
</html>
